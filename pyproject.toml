[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psearch"
version = "0.1.0"
description = "A small, privacy-focused CLI metasearch tool."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.scripts]
psearch = "psearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
